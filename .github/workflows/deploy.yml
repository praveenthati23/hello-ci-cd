name: Java CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build-analyze-deploy:
    name: Build, Analyze, Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run Static Analysis and Unit Tests
        run: mvn --batch-mode clean verify site

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/site/pmd.html

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugs.html

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/site/checkstyle.html

      - name: Post Code Analysis Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            function readCount(file, pattern) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                return (content.match(new RegExp(pattern, 'g')) || []).length;
              } catch (e) {
                return 0;
              }
            }

            const pmd = readCount('target/pmd.xml', '<violation');
            const spotbugs = readCount('target/spotbugsXml.xml', 'BugInstance');
            const checkstyle = readCount('target/checkstyle-result.xml', '<error');

            let body = `## 🧪 Code Analysis Report\n\n`;
            if (pmd > 0) body += `🔸 **PMD**: ${pmd} violations\n`;
            if (spotbugs > 0) body += `🔸 **SpotBugs**: ${spotbugs} bugs\n`;
            if (checkstyle > 0) body += `🔸 **Checkstyle**: ${checkstyle} issues\n`;

            if (pmd === 0 && spotbugs === 0 && checkstyle === 0) {
              body += `✅ No issues found!\n`;
            }

            body += `\n📥 [View full reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            body += `\n\n<sub>🤖 Generated by GitHub Actions</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Deploy to EC2
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "target/hello-ci-cd-1.0-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      
